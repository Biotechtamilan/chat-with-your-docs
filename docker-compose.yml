services:
  app:
    build: .
    ports:
      # Published on localhost only: the app has no login. Put it behind your own auth before exposing it.
      - "127.0.0.1:3000:3000"
    environment:
      # Read from your shell or a .env file next to this compose file.
      # Leave it unset to run in offline mode (search works, answers are quoted passages).
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-deepseek/deepseek-v4.1-flash-1017}
      # The container listens on every interface, so the Connection panel is read-only
      # unless a settings token is set (24 characters or more, e.g. openssl rand -hex 24). The panel then asks for it.
      # SETTINGS_TOKEN: ${SETTINGS_TOKEN:-}
    volumes:
      # One container, one volume: the embedded database is single-process by design.
      - marginalia-data:/data
    restart: unless-stopped

volumes:
  marginalia-data:
